openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
  description: API documentation for the Todo Spring Boot application.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponseDto:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
        email:
          type: string
        message:
          type: string
    RegisterRequestDto:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
          format: email
    TodoRequestDto:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
    TodoResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
security:
  - BearerAuth: []
paths:
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequestDto"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Unauthorized
  /api/auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
      responses:
        "201":
          description: User registered
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
  /api/auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            text/plain:
              schema:
                type: string
  /api/todos:
    post:
      summary: Create a Todo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoRequestDto"
      responses:
        "201":
          description: Todo created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoResponseDto"
        "401":
          description: Unauthorized
    get:
      summary: Get all Todos for current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of Todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoResponseDto"
        "401":
          description: Unauthorized
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get Todo by id
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Todo item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoResponseDto"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    put:
      summary: Update Todo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoRequestDto"
      responses:
        "200":
          description: Updated Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoResponseDto"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      summary: Delete Todo
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
        "401":
          description: Unauthorized
