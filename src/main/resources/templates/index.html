<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Todo - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Auth UI -->
    <div class="container" id="auth-container">
        <div class="glass-panel text-center">
            <header>
                <h1>Welcome</h1>
                <p>Login or create an account to manage your tasks</p>
            </header>
            
            <div id="auth-alert" class="alert hidden"></div>

            <form id="auth-form">
                <div class="input-group">
                    <input type="text" id="auth-username" placeholder="Username (min 6 chars)" required minlength="6">
                    <input type="password" id="auth-password" placeholder="Password (min 6 chars)" required minlength="6">
                    
                    <button type="submit" class="btn-primary" id="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    <button type="button" class="btn-secondary" id="btn-signup">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Todo UI -->
    <div class="container hidden" id="main-container">
        <div class="glass-panel">
            <header>
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div style="text-align: left;">
                        <h1>Todo Workspace</h1>
                        <p id="welcome-message">Manage your tasks seamlessly</p>
                    </div>
                    <button id="btn-logout" class="btn-icon" title="Logout" style="font-size: 1.5rem; color: var(--danger);">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <form id="todo-form">
                <div class="input-group">
                    <input type="text" id="todo-title" placeholder="What needs to be done?" required minlength="3">
                    <input type="text" id="todo-desc" placeholder="Details (optional)...">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </form>

            <div class="todo-list-container">
                <ul id="todo-list">
                    <!-- Todos injected here -->
                </ul>
                <div id="loading" class="loading-state">Loading tasks...</div>
            </div>
            
            <div class="stats">
                <span id="task-count">0 tasks</span>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
